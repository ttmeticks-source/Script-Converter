[package]
name = "realismcraft"
version = "0.1.0"
edition = "2021"
description = "An original cross-platform voxel sandbox prototype"
license = "MIT"

[dependencies]
macroquad = "0.4.14"
miniquad = "0.4.11"
getrandom = "0.2.17"
pbkdf2 = "0.12.2"
sha2 = "0.10.9"
rayon = "1.10.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
